repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-bn", "-s", "-w"]
        exclude: ^hooks/run-hook\.cmd$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: ^hooks/run-hook\.cmd$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: oxlint
        language: system
        types_or: [ts, javascript]
        exclude: ^skills/(decision-logging|structured-argumentation|syncing-decisions-to-memory|recalling-project-context|blast-radius)/scripts/|^hooks/blast-radius-audit\.cjs$

      - id: oxfmt
        name: oxfmt
        entry: oxfmt
        language: system
        types_or: [ts, javascript, json, yaml]
        exclude: ^skills/(decision-logging|structured-argumentation|syncing-decisions-to-memory|recalling-project-context|blast-radius)/scripts/|^hooks/blast-radius-audit\.cjs$

      - id: build-decision-logging
        name: build decision-logging bundles
        entry: scripts/build-decision-logging.sh
        language: system
        files: ^skills/decision-logging/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-decision-logging
        name: bun test decision-logging
        entry: bash -c 'cd tests/decision-logging && bun test'
        language: system
        files: ^skills/decision-logging/(src|scripts)/|^tests/decision-logging/
        pass_filenames: false

      - id: build-structured-argumentation
        name: build structured-argumentation bundle
        entry: scripts/build-structured-argumentation.sh
        language: system
        files: ^skills/structured-argumentation/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-structured-argumentation
        name: bun test structured-argumentation
        entry: bash -c 'cd tests/structured-argumentation && bun test'
        language: system
        files: ^skills/structured-argumentation/(src|scripts|templates)/|^tests/structured-argumentation/
        pass_filenames: false

      - id: build-syncing-decisions-to-memory
        name: build syncing-decisions-to-memory bundle
        entry: scripts/build-syncing-decisions-to-memory.sh
        language: system
        files: ^skills/syncing-decisions-to-memory/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-syncing-decisions-to-memory
        name: bun test syncing-decisions-to-memory
        entry: bash -c 'cd tests/syncing-decisions-to-memory && bun test'
        language: system
        files: ^skills/syncing-decisions-to-memory/(src|scripts)/|^tests/syncing-decisions-to-memory/
        pass_filenames: false

      - id: build-recalling-project-context
        name: build recalling-project-context bundle
        entry: scripts/build-recalling-project-context.sh
        language: system
        files: ^skills/recalling-project-context/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-recalling-project-context
        name: bun test recalling-project-context
        entry: bash -c 'cd tests/recalling-project-context && bun test'
        language: system
        files: ^skills/recalling-project-context/(src|scripts)/|^tests/recalling-project-context/
        pass_filenames: false

      - id: build-blast-radius
        name: build blast-radius bundle
        entry: scripts/build-blast-radius.sh
        language: system
        files: ^skills/blast-radius/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-blast-radius
        name: bun test blast-radius
        entry: bash -c 'cd tests/blast-radius && bun test'
        language: system
        files: ^skills/blast-radius/(src|scripts)/|^tests/blast-radius/|^hooks/blast-radius-audit\.(sh|cjs)$
        pass_filenames: false

      - id: build-measuring-skill-performance
        name: build measuring-skill-performance bundle
        entry: scripts/build-measuring-skill-performance.sh
        language: system
        files: ^skills/measuring-skill-performance/src/.*\.ts$
        pass_filenames: false

      - id: bun-test-measuring-skill-performance
        name: bun test measuring-skill-performance
        entry: bash -c 'cd tests/measuring-skill-performance && bun test'
        language: system
        files: ^skills/measuring-skill-performance/(src|scripts)/|^tests/measuring-skill-performance/
        pass_filenames: false
